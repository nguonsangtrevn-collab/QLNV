    <script>
      // Fix for React 19 in cross-origin iframes (AI Studio preview):
      // In development mode, React 19 User Timing profiling attempts to diff props on re-renders,
      // traversing objects and DOM elements up to window.parent, causing SecurityError when checking $$typeof.
      // Setting console.timeStamp = undefined safely disables React 19 User Timing without affecting functionality.
      try {
        if (typeof console !== 'undefined') {
          Object.defineProperty(console, 'timeStamp', {
            value: undefined,
            writable: true,
            configurable: true
          });
        }
      } catch (e) {}
    </script>
